info:
  name: Rejects a wrong token
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/v1/requests/{{requestId}}/documents"
  auth:
    type: bearer
    token: not-the-real-service-token-but-long-enough-0000
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 401", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("returns the same message as a missing token", function () {
          expect(res.getBody()).to.deep.equal({ detail: "invalid service token" });
        });
