info:
  name: Health check
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/health"
  headers:
    - name: X-Request-ID
      value: bruno-health-check
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("reports status ok", function () {
          expect(res.getBody()).to.deep.equal({ status: "ok" });
        });

        test("echoes the X-Request-ID header for tracing", function () {
          expect(res.getHeader("x-request-id")).to.equal("bruno-health-check");
        });
