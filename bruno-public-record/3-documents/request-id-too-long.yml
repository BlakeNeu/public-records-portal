info:
  name: Rejects an ID longer than 64 characters
  type: http
  seq: 5
http:
  method: GET
  url: "{{baseUrl}}/v1/requests/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/documents"
  auth: inherit
docs: The ID in this URL is 65 characters long. The limit is 64.
runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 422", function () {
          expect(res.getStatus()).to.equal(422);
        });

        test("names request_id as the invalid field", function () {
          const locs = res.getBody().detail.map(function (e) { return e.loc.join("."); });
          expect(locs).to.include("path.request_id");
        });
